name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PRs (inclusive de forks) não recebem secrets: o exemplo já vem em modo emulador.
      - run: cp src/environments/firebase.config.example.ts src/environments/firebase.config.ts
      - run: npm run build
      - run: npm test -- --watch=false

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
