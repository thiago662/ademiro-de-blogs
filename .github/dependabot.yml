version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors do Angular (e do TypeScript, que o Angular fixa) vão por `ng update`, que roda as migrações.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript']
      firebase:
        patterns: ['firebase', 'firebase-tools', '@firebase/*']
      milkdown:
        patterns: ['@milkdown/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
