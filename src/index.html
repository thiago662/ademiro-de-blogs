<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>Ademiro de Blogs</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    CSP: sem scripts inline/eval. Imagens só https (posts usam URL externa).
    connect-src: APIs do Firebase + emulador local (127.0.0.1) + websocket do ng serve.
    style 'unsafe-inline': Angular e o editor (CodeMirror) injetam <style> em runtime.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' https: data: blob:;
    font-src 'self' data:;
    connect-src 'self' https://*.googleapis.com http://127.0.0.1:9099 http://127.0.0.1:8080 ws://localhost:*;
    frame-src https://*.firebaseapp.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self'
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Painel administrativo: fora dos buscadores; o card de compartilhamento continua funcionando. -->
  <meta name="robots" content="noindex">
  <meta name="description" content="Gerenciador de conteúdo para vários blogs: Markdown, campos por blog e sites estáticos no GitHub Pages.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">

  <!-- Open Graph / Twitter. __SITE_URL__ é trocado pela URL do Pages no deploy (ver deploy.yml). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ademiro de Blogs">
  <meta property="og:title" content="Ademiro de Blogs">
  <meta property="og:description" content="Gerenciador de conteúdo para vários blogs: Markdown, campos por blog e sites estáticos no GitHub Pages.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Ademiro de Blogs e o texto: gerenciador de conteúdo para vários blogs.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme-init.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
